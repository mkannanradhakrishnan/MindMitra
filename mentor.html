<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentor Queue — MindMitra</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    <div id="app-sidebar-placeholder"></div>

    <div style="flex: 1; display: flex; flex-direction: column;">
      <div id="mobile-header-placeholder"></div>

      <main class="app-main">
        <div class="container-narrow">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px;">
            <div>
              <p class="text-sm text-muted font-bold">Mentor workspace</p>
              <h1 class="title-lg" style="margin-top: 4px;">Peer support queue</h1>
              <p class="text-sm text-muted" style="margin-top: 6px;">
                Use anonymous aliases only. You are a trained peer supporter providing compassionate listening, not a therapist.
              </p>
            </div>

            <!-- Role Switcher -->
            <button type="button" id="btn-toggle-role" class="btn btn-outline btn-sm">
              Role: <strong id="current-role-badge">Student</strong> (Switch)
            </button>
          </div>

          <!-- Queue List Container -->
          <div style="margin-top: 28px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <h2 class="title-sm">Incoming student requests</h2>
              <button type="button" id="btn-create-sample-request" class="btn btn-ghost btn-sm">+ Add simulated student request</button>
            </div>

            <div id="mentor-rooms-list" style="display: flex; flex-direction: column; gap: 12px;">
              <!-- Populated dynamically -->
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const user = window.MindMitraStorage.getUser() || { name: 'Peer Mentor', role: 'mentor' };
      const roleBadge = document.getElementById('current-role-badge');
      const toggleRoleBtn = document.getElementById('btn-toggle-role');
      const roomsContainer = document.getElementById('mentor-rooms-list');
      const addSampleBtn = document.getElementById('btn-create-sample-request');

      function updateRoleUI() {
        roleBadge.textContent = user.role === 'mentor' ? 'Peer Mentor' : 'Student';
      }

      toggleRoleBtn.addEventListener('click', () => {
        const nextRole = user.role === 'mentor' ? 'student' : 'mentor';
        window.MindMitraStorage.setRole(nextRole);
        user.role = nextRole;
        updateRoleUI();
        window.MindMitraApp.toast(`Switched perspective to ${nextRole === 'mentor' ? 'Peer Mentor' : 'Student'}.`, 'info');
        renderRooms();
      });

      function renderRooms() {
        const rooms = window.MindMitraStorage.getRooms().filter((r) => r.status === 'waiting' || r.status === 'active');

        if (rooms.length === 0) {
          roomsContainer.innerHTML = `
            <div class="card text-center" style="padding: 36px 20px;">
              <p class="text-sm text-muted">No waiting or active support requests at this moment.</p>
              <button type="button" class="btn btn-secondary btn-sm" style="margin-top: 12px;" onclick="document.getElementById('btn-create-sample-request').click()">
                Generate a simulated request
              </button>
            </div>
          `;
          return;
        }

        roomsContainer.innerHTML = rooms.map((room) => {
          const isWaiting = room.status === 'waiting';
          const time = new Date(room.created_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

          return `
            <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; padding: 18px 24px;">
              <div style="display: flex; align-items: center; gap: 14px;">
                <div style="width: 44px; height: 44px; background: ${isWaiting ? 'var(--mint)' : 'var(--cream)'}; border-radius: var(--radius-md); display: grid; place-items: center; color: var(--ink);">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div>
                  <h3 style="font-weight: 800; font-size: 1.05rem;">${room.student_alias || 'Anonymous Student'}</h3>
                  <p class="text-xs text-muted" style="margin-top: 2px;">
                    ${isWaiting ? '<span class="badge badge-coral" style="font-size: 0.7rem; padding: 2px 6px;">Waiting for mentor</span>' : '<span class="badge badge-sage" style="font-size: 0.7rem; padding: 2px 6px;">Active session</span>'}
                    · Requested at ${time}
                  </p>
                </div>
              </div>

              <div style="display: flex; gap: 8px;">
                ${isWaiting ? `
                  <button type="button" class="btn btn-primary btn-sm" onclick="claimRoom('${room.id}')">
                    Accept request
                  </button>
                ` : `
                  <a href="chat.html" class="btn btn-secondary btn-sm">
                    Open chat
                  </a>
                  <button type="button" class="btn btn-outline btn-sm" onclick="closeRoom('${room.id}')">
                    End conversation
                  </button>
                `}
              </div>
            </div>
          `;
        }).join('');
      }

      window.claimRoom = function (roomId) {
        window.MindMitraStorage.claimRoom(roomId, user.id);
        renderRooms();
        window.MindMitraApp.toast('Request accepted! You can now open chat.', 'success');
      };

      window.closeRoom = function (roomId) {
        if (confirm('Mark this conversation as completed?')) {
          window.MindMitraStorage.closeRoom(roomId);
          renderRooms();
          window.MindMitraApp.toast('Conversation completed.', 'info');
        }
      };

      addSampleBtn.addEventListener('click', () => {
        const animalNames = ['Gentle Otter', 'Patient Panda', 'Calm Sparrow', 'Mindful Lynx', 'Quiet Bear'];
        const randomAlias = animalNames[Math.floor(Math.random() * animalNames.length)] + ' #' + Math.floor(100 + Math.random() * 900);
        window.MindMitraStorage.createPeerRoom('simulated_' + Date.now(), randomAlias);
        renderRooms();
        window.MindMitraApp.toast(`Simulated support request created for ${randomAlias}.`, 'info');
      });

      updateRoleUI();
      renderRooms();
    })();
  </script>
</body>
</html>
